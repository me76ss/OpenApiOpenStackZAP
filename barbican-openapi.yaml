openapi: 3.0.3
info:
  title: OpenStack Barbican API (Key Manager Service)
  version: "1.0"
  description: "OpenAPI definition for Barbican Key Manager Service - Safe DAST Surface"
servers:
  - url: http://192.168.214.100:9311/v1
    description: "Barbican Public Endpoint"

components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: "Keystone Auth Token"

security:
  - tokenAuth: []

paths:
  /secrets:
    get:
      summary: "List Secrets"
      description: "Lists metadata for secrets accessible by the user."
      responses:
        '200':
          description: "Success"

  /orders:
    get:
      summary: "List Orders"
      description: "Lists secret creation or certificate issuance orders."
      responses:
        '200':
          description: "Success"

  /containers:
    get:
      summary: "List Containers"
      description: "Lists secret containers (e.g. RSA pairs, certificate chains)."
      responses:
        '200':
          description: "Success"

  /quotas:
    get:
      summary: "Show Barbican Quotas"
      description: "Lists resource quotas for the project."
      responses:
        '200':
          description: "Success"

  /cas:
    get:
      summary: "List Certificate Authorities"
      description: "Lists available Certificate Authorities (CAs)."
      responses:
        '200':
          description: "Success"

  /acls:
    get:
      summary: "List Access Control Lists"
      description: "Lists secret access control lists."
      responses:
        '200':
          description: "Success"

